<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 02 - listaCidadesAPartirDeEstados</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 25px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    select {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }
    #selecionado {
      margin-top: 20px;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <h1>lista Cidades A Partir De Estados</h1>

  <label for="estado">Estado:</label>
  <select id="estado">
    <option value="">Selecione um estado</option>
  </select>

  <label for="cidade">Cidade:</label>
  <select id="cidade" disabled>
    <option value="">Selecione uma cidade</option>
  </select>

  <div id="selecionado"></div>

  <script>
    const selectEstado = document.getElementById('estado');
    const selectCidade = document.getElementById('cidade');
    const divSelecionado = document.getElementById('selecionado');


    async function carregarEstados() {
      try {
        const response = await fetch('https://servicodados.ibge.gov.br/api/v1/localidades/estados');
        const estados = await response.json();


        estados.sort((a, b) => a.nome.localeCompare(b.nome));

        estados.forEach(estado => {
          const option = document.createElement('option');
          option.value = estado.sigla;
          option.textContent = estado.nome;
          selectEstado.appendChild(option);
        });
      } catch (error) {
        console.error('Erro ao carregar estados:', error);
      }
    }


    selectEstado.addEventListener('change', async function() {
      const uf = this.value;
      selectCidade.innerHTML = '<option value="">Selecione uma cidade</option>';
      selectCidade.disabled = true;
      divSelecionado.textContent = '';

      if (!uf) return;

      try {
        const response = await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${uf}/municipios`);
        const cidades = await response.json();


        cidades.sort((a, b) => a.nome.localeCompare(b.nome));

        cidades.forEach(cidade => {
          const option = document.createElement('option');
          option.value = cidade.nome;
          option.textContent = cidade.nome;
          selectCidade.appendChild(option);
        });

        selectCidade.disabled = false;
      } catch (error) {
        console.error('Erro ao carregar cidades:', error);
      }
    });


    selectCidade.addEventListener('change', function() {
      const cidade = this.value;
      const estado = selectEstado.options[selectEstado.selectedIndex].text;

      if (cidade) {
        divSelecionado.textContent = `Você selecionou: ${cidade} - ${estado}`;
      } else {
        divSelecionado.textContent = '';
      }
    });


    carregarEstados();
  </script>
</body>
</html>
