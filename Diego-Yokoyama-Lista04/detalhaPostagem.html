<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 03 - detalhaPostagem</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    select {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }
    .lista-posts {
      margin-bottom: 20px;
    }
    .post-titulo {
      display: block;
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 4px;
      background-color: #f0f0f0;
      border: 1px solid #ddd;
      border-radius: 3px;
      cursor: pointer;
      text-align: left;
      font-size: 0.95rem;
    }
    .post-titulo:hover {
      background-color: #e0e0e0;
    }
    .post-titulo.selecionado {
      background-color: #d0d0d0;
      font-weight: bold;
    }
    #detalhes {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #ccc;
    }
    #detalhes h3 {
      margin-top: 0;
      color: #333;
    }
    #detalhes p {
      line-height: 1.5;
      margin-bottom: 15px;
    }
    .comentario {
      margin-bottom: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
    .comentario strong {
      color: #222;
    }
    .comentario span {
      color: #555;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <h1>detalha Postagem</h1>

  <label for="usuario">Usuário:</label>
  <select id="usuario">
    <option value="">Selecione um usuário</option>
  </select>

  <div class="lista-posts" id="listaPosts"></div>

  <div id="detalhes"></div>

  <script>
    const selectUsuario = document.getElementById('usuario');
    const listaPosts = document.getElementById('listaPosts');
    const detalhes = document.getElementById('detalhes');


    async function carregarUsuarios() {
      try {
        const response = await fetch('https://jsonplaceholder.typicode.com/users');
        const usuarios = await response.json();

        usuarios.forEach(user => {
          const option = document.createElement('option');
          option.value = user.id;
          option.textContent = user.name;
          selectUsuario.appendChild(option);
        });
      } catch (error) {
        console.error('Erro ao carregar usuários:', error);
      }
    }


    selectUsuario.addEventListener('change', async function() {
      const userId = this.value;
      listaPosts.innerHTML = '';
      detalhes.innerHTML = '';

      if (!userId) return;

      try {
        const response = await fetch(`https://jsonplaceholder.typicode.com/posts?userId=${userId}`);
        const posts = await response.json();

        posts.forEach(post => {
          const btn = document.createElement('button');
          btn.className = 'post-titulo';
          btn.textContent = post.title;
          btn.dataset.id = post.id;

          btn.addEventListener('click', () => {

            document.querySelectorAll('.post-titulo').forEach(b => b.classList.remove('selecionado'));
            btn.classList.add('selecionado');
            mostrarDetalhes(post.id, post.title);
          });

          listaPosts.appendChild(btn);
        });
      } catch (error) {
        console.error('Erro ao carregar postagens:', error);
      }
    });


    async function mostrarDetalhes(postId, titulo) {
      detalhes.innerHTML = '<p>Carregando...</p>';

      try {

        const [postRes, commentsRes] = await Promise.all([
          fetch(`https://jsonplaceholder.typicode.com/posts/${postId}`),
          fetch(`https://jsonplaceholder.typicode.com/posts/${postId}/comments`)
        ]);

        const post = await postRes.json();
        const comments = await commentsRes.json();

        let html = `
          <h3>${post.title}</h3>
          <p>${post.body}</p>
          <h4>Comentários:</h4>
        `;

        comments.forEach(c => {
          html += `
            <div class="comentario">
              <strong>${c.name}:</strong>
              <span> ${c.body}</span>
            </div>
          `;
        });

        detalhes.innerHTML = html;
      } catch (error) {
        detalhes.innerHTML = '<p>Erro ao carregar detalhes da postagem.</p>';
        console.error(error);
      }
    }


    carregarUsuarios();
  </script>
</body>
</html>
