<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 01 - buscaCep</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #e0e0e0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background-color: #d0d0d0;
    }
    #resultado {
      margin-top: 20px;
      line-height: 1.6;
    }
    .erro {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>busca CEP</h1>
  
  <input type="text" id="cep" placeholder="Digite o CEP (ex: 01001000)" maxlength="9">
  <button onclick="buscarCep()">Buscar Endereço</button>
  
  <div id="resultado"></div>

  <script>
    async function buscarCep() {
      const cepInput = document.getElementById('cep');
      const resultado = document.getElementById('resultado');
      
     
      let cep = cepInput.value.replace(/\D/g, '');
      
      if (cep.length !== 8) {
        resultado.innerHTML = '<p class="erro">Erro ao buscar endereço.</p>';
        return;
      }

      try {
        const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        const data = await response.json();

        if (data.erro) {
          resultado.innerHTML = '<p class="erro">Erro ao buscar endereço.</p>';
          return;
        }

        resultado.innerHTML = `
          <p><strong>Logradouro:</strong> ${data.logradouro || 'Não informado'}</p>
          <p><strong>Bairro:</strong> ${data.bairro || 'Não informado'}</p>
          <p><strong>Cidade:</strong> ${data.localidade || 'Não informado'}</p>
          <p><strong>Estado:</strong> ${data.uf || 'Não informado'}</p>
        `;
      } catch (error) {
        resultado.innerHTML = '<p class="erro">Erro ao buscar endereço.</p>';
      }
    }

 
    document.getElementById('cep').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') buscarCep();
    });
  </script>
</body>
</html>
