<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>verificadorIdade.html</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #624be6;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            background-color: #19c5db;
            border-radius: 10px;
            padding: 20px;
            width: 360px;
            text-align: center;
        }

        h1 {
            color: white;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .card {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
        }

        label {
            font-size: 14px;
        }

        input[type="number"] {
            width: 60px;
        }

        button {
            margin-top: 12px;
            padding: 6px 16px;
            cursor: pointer;
        }

        #resultado {
            margin-top: 15px;
            font-size: 14px;
        }

        #imagem {
            font-size: 100px;
            width: 220px;
            height: 220px;
            line-height: 220px;
            border-radius: 50%;
            background-color: #eee;
            margin: 20px auto 0;
            display: none;
        }

        footer {
            color: white;
            font-size: 12px;
            font-style: italic;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Verificador de Idade</h1>

        <div class="card">
            <label>Ano de Nascimento:
                <input type="number" id="ano" value="1994">
            </label>

            <p>
                Sexo:
                <label><input type="radio" name="sexo" value="Masculino"> Masculino</label>
                <label><input type="radio" name="sexo" value="Feminino" checked> Feminino</label>
            </p>

            <button onclick="verificar()">Verificar</button>

            <p id="resultado"></p>

            <div id="imagem"></div>
        </div>

        <footer>© Uniderp</footer>
    </div>

    <script src="script.js"></script>

</body>

</html>
